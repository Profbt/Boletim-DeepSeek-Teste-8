<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== TELA DE ACESSO (PIN) ===== -->
  <section class="tela-acesso" id="telaAcesso">
    <div class="cartao-acesso">
      <h1>Boletim Digital</h1>
      <p class="acesso-serie">8º Ano — Turma 8A</p>
      <p class="acesso-chamada">Número de chamada: 12</p>

      <label class="acesso-rotulo" for="campoPin">Digite seu PIN</label>
      <input
        type="password"
        id="campoPin"
        class="acesso-campo"
        inputmode="numeric"
        autocomplete="off"
        maxlength="12"
        placeholder="••••"
      />

      <button type="button" id="botaoEntrar" class="acesso-botao">Entrar</button>

      <p class="acesso-mensagem" id="mensagemAcesso"></p>
    </div>
  </section>

  <!-- ===== CONTEÚDO DO BOLETIM ===== -->
  <div id="appBoletim" class="app-boletim oculto">

    <header class="cabecalho">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">8º Ano — Turma 8A — Chamada 12</p>
    </header>

    <main class="conteudo">

      <div class="barra-acoes">
        <button type="button" id="botaoAlterar" class="botao-acao">Alterar dados</button>
        <button type="button" id="botaoSalvar" class="botao-acao botao-salvar oculto">Salvar</button>
        <button type="button" id="botaoCancelar" class="botao-acao botao-cancelar oculto">Cancelar</button>
        <span class="status-salvar" id="statusSalvar"></span>
      </div>

      <section class="cards-resumo" id="cardsResumo"></section>

      <!-- ===== ÁREA DOS GRÁFICOS ===== -->
      <section class="area-graficos">
        <div class="card-grafico container-grafico-disciplinas">
          <h2>Média por disciplina</h2>
          <div class="wrapper-canvas-disciplinas">
            <canvas id="graficoMediasDisciplinas"></canvas>
          </div>
        </div>
        <div class="card-grafico">
          <h2>Evolução da média geral</h2>
          <div class="wrapper-canvas-evolucao">
            <canvas id="graficoEvolucaoTrimestres"></canvas>
          </div>
        </div>
      </section>

      <section class="area-tabela">
        <h2>Notas por disciplina</h2>

        <div class="tabela-responsiva">
          <table class="tabela-boletim">
            <thead>
              <tr>
                <th>Disciplina</th>
                <th>1º Tri</th>
                <th>2º Tri</th>
                <th>3º Tri</th>
                <th>Média</th>
                <th>Faltas</th>
                <th>Situação</th>
              </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
        </div>
      </section>

    </main>

    <footer class="rodape">
      <p>Projeto escolar — dados fictícios para demonstração.</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
